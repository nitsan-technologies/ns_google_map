<div class="info-window">
    <div class="title">
        <p>
            {address.title}
        </p>
    </div>
    <div class="address">
        <f:format.html parseFuncTSPath="lib.parseFunc">{address.infocontent}</f:format.html>
    </div>
    <f:if condition="{address.maplink}">
        <div class="view-link">
            <a href="https://maps.google.com/maps?daddr=<f:format.urlencode>{address.address}</f:format.urlencode>(<f:format.urlencode>{address.title}</f:format.urlencode>)"
               target="_blank" rel="noopener noreferrer">
                <span>
                    <f:translate
                            key="LLL:EXT:ns_google_map/Resources/Private/Language/locallang.xlf:tx_nsgooglemap_domain_model_address.maplink">
                    </f:translate>
                </span>
            </a>
        </div>
    </f:if>
</div>
